name: Deploy Backend
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync backend to VPS
        run: |
          rsync -az --delete \
            --exclude node_modules \
            --exclude .env \
            --exclude data \
            --exclude server/uploads \
            -e "ssh -i ~/.ssh/id_ed25519" \
            backend/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/

      - name: Install deps and restart service
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            export PATH=/opt/partyledger-backend/node/bin:$PATH
            cd ${{ secrets.VPS_APP_DIR }}
            npm install
            chown -R plaapp:plaapp /opt/partyledger-backend
            systemctl restart partyledger-backend
            sleep 2
            curl -sf http://127.0.0.1:8098/health
          '
